name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go vet, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchains pinned in mise.toml (Go 1.27).
      - uses: jdx/mise-action@v2

      - name: go vet
        run: mise exec -- go vet ./...

      - name: gofmt
        run: |
          unformatted="$(mise exec -- gofmt -l internal cmd)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # The Go binary embeds internal/api/webdist; make sure the directory exists.
      - name: Create embed placeholder
        run: mkdir -p internal/api/webdist && touch internal/api/webdist/.keep

      - name: go test
        run: mise exec -- go test -race -count=1 ./...

  web:
    name: Web typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      # The Go job never builds the UI, so the built-index.html CSP check only runs here.
      - uses: jdx/mise-action@v2

      - name: CSP check on built UI
        run: mise exec -- go test -run TestCSPAllowsBuiltUIWithoutInlineScripts ./internal/api/

  # Opens every route at two phone sizes in Chromium against a mocked backend and checks the
  # layout (no sideways scroll, nav reachable, content in view). Known bugs are listed in
  # web/e2e/mobile.spec.ts and skipped.
  web-mobile:
    name: Web mobile layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Mobile layout check
        working-directory: web
        run: npm run test:mobile

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: web/e2e-results/screenshots
          if-no-files-found: warn

  # Starts a real `onett serve` (throwaway HOME, free port, stub ntfy server) and drives the
  # built UI through first-run setup in Chromium: owner account, project, agent, policy, ntfy with
  # a secret token, then checks the files on disk. No external network. See
  # web/e2e-daemon/first-run.spec.ts.
  web-daemon:
    name: Web first-run journey (real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchains pinned in mise.toml (Go 1.27).
      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The binary embeds the built UI, so build the UI first.
      - name: Build onett
        run: |
          (cd web && npm run build)
          mise exec -- go build -o "$RUNNER_TEMP/onett" ./cmd/onett

      - name: First-run journey
        working-directory: web
        env:
          ONETT_E2E_BINARY: ${{ runner.temp }}/onett
        run: npx playwright test -c playwright.daemon.config.ts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-journey-screenshots
          path: web/e2e-results/daemon-screenshots
          if-no-files-found: warn

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-journey-report
          path: |
            web/e2e-results/daemon-report
            web/e2e-results/daemon-traces
          if-no-files-found: warn
